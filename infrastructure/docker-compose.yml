version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inboxiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inboxiq}
      POSTGRES_USER: ${DB_USERNAME:-inboxiq_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inboxiq_secure_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inboxiq_user} -d ${DB_NAME:-inboxiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: inboxiq_postgres_data

